name: Firebase CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-app
    env:
      # PR checks use placeholders rather than production credentials.
      REACT_APP_FIREBASE_API_KEY: ci-placeholder
      REACT_APP_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      REACT_APP_FIREBASE_PROJECT_ID: ci-placeholder
      REACT_APP_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      REACT_APP_FIREBASE_APP_ID: "1:000000000000:web:ci"
      REACT_APP_FIREBASE_MEASUREMENT_ID: G-CI00000000
      REACT_APP_GOOGLE_MAPS_API_KEY: ci-placeholder
      REACT_APP_DC_WARD_API_KEY: ""
      REACT_APP_USE_EMULATORS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: my-app/functions-python/requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r functions-python/requirements.txt

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r functions-python/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run unit tests
        run: CI=true npm run test:ci

      - name: Compile Python functions and active-status service
        run: |
          python -m py_compile \
            functions-python/main.py \
            functions-python/clustering.py \
            ../cloudrun-etl/main.py \
            ../cloudrun-etl/update_active_status.py

      - name: Run Python unit tests
        run: python -m unittest discover -s functions-python -p 'test_*.py'

      - name: Run ETL address unit tests
        run: python -m unittest discover -s ../ETL -p 'test_address*.py'

      - name: Check Cloud Run deployment script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          $scriptPath = Join-Path $PWD "../cloudrun-etl/services/deploy-cloudrun-services.ps1"
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            $scriptPath,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "Cloud Run deployment script has syntax errors."
          }

      - name: Build frontend
        run: CI=false npm run build

  deploy:
    name: Deploy to FFA Production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: firebase-prod
      cancel-in-progress: false

    defaults:
      run:
        working-directory: my-app

    env:
      FIREBASE_PROJECT_ID: food-for-all-dc-ffa
      FUNCTIONS_DISCOVERY_TIMEOUT: "60"
      REACT_APP_FIREBASE_API_KEY: ${{ secrets.FFA_FIREBASE_API_KEY }}
      REACT_APP_FIREBASE_AUTH_DOMAIN: food-for-all-dc-ffa.firebaseapp.com
      REACT_APP_FIREBASE_PROJECT_ID: food-for-all-dc-ffa
      REACT_APP_FIREBASE_STORAGE_BUCKET: food-for-all-dc-ffa.firebasestorage.app
      REACT_APP_FIREBASE_MESSAGING_SENDER_ID: "490155753803"
      REACT_APP_FIREBASE_APP_ID: "1:490155753803:web:1f5dcad449fb0d4bcb28ce"
      REACT_APP_FIREBASE_MEASUREMENT_ID: ""
      REACT_APP_GOOGLE_MAPS_API_KEY: ${{ secrets.FFA_GOOGLE_MAPS_API_KEY }}
      REACT_APP_DC_WARD_API_KEY: ""
      REACT_APP_USE_EMULATORS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: my-app/functions-python/requirements.txt

      - name: Validate deployment configuration
        env:
          FFA_WIF_PROVIDER: ${{ secrets.FFA_GCP_WIF_PROVIDER }}
          FFA_DEPLOY_ACCOUNT: ${{ secrets.FFA_GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for name in REACT_APP_FIREBASE_API_KEY REACT_APP_GOOGLE_MAPS_API_KEY FFA_WIF_PROVIDER FFA_DEPLOY_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing configuration: $name"
              exit 1
            fi
          done

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: CI=false npm run build

      - name: Prepare Python virtualenv for Firebase deploy
        run: |
          python -m venv functions-python/venv
          source functions-python/venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r functions-python/requirements.txt
          python -m pip check

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.35.0

      - name: Authenticate to Google Cloud via OIDC
        uses: google-github-actions/auth@v3
        with:
          project_id: food-for-all-dc-ffa
          workload_identity_provider: ${{ secrets.FFA_GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.FFA_GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Apply Storage bucket CORS
        run: gcloud storage buckets update gs://food-for-all-dc-ffa.firebasestorage.app --cors-file=storage-cors.json --project=food-for-all-dc-ffa

      # Index builds finish asynchronously.
      - name: Deploy Firestore rules, indexes, and Storage rules
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only "firestore:rules,firestore:indexes,storage" --non-interactive

      - name: Deploy Functions
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only functions --non-interactive

      # Updates services without invoking them or changing Scheduler jobs.
      - name: Deploy standalone Cloud Run services
        shell: pwsh
        run: |
          & ../cloudrun-etl/services/deploy-cloudrun-services.ps1 `
            -ProjectId food-for-all-dc-ffa `
            -ReportToEmail jamiebrs@gmail.com `
            -SendGridSecretVersion "2"

      - name: Deploy Hosting
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive